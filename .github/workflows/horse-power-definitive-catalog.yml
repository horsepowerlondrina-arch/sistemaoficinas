name: Horse Power definitive catalog copy

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify the catalog in disposable PostgreSQL 17, or also load the new definitive database
        type: choice
        required: true
        default: preflight-only
        options: [preflight-only, load-definitive]
      rights_confirmed:
        description: Confirm approved use of the existing technical catalog
        type: choice
        required: true
        default: no
        options: [no, yes]

permissions:
  contents: read

concurrency:
  group: horse-power-definitive-catalog
  cancel-in-progress: false

jobs:
  copy-catalog:
    if: inputs.rights_confirmed == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: horse-power-catalog-copy
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-temporary-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare disposable PostgreSQL 17
        run: node scripts/ci-catalog-import-setup.mjs
        env:
          CI_PG_ADMIN_URL: postgres://postgres:ci-temporary-only@127.0.0.1:5432/postgres
      - name: Copy seven read-only tables to temporary runner storage
        run: node scripts/catalog-copy-from-homologation.mjs "$RUNNER_TEMP/catalog-copy.sqlite"
        env:
          HP_CATALOG_SOURCE_PASSWORD: ${{ secrets.HP_CATALOG_SOURCE_PASSWORD }}
      - name: Verify the copied source
        run: npm run catalog:import -- "$RUNNER_TEMP/catalog-copy.sqlite" --verify-source
      - name: Verify complete import in disposable PostgreSQL 17
        run: npm run catalog:import -- "$RUNNER_TEMP/catalog-copy.sqlite"
        env:
          CATALOG_IMPORT_DATABASE_URL: postgres://postgres:ci-temporary-only@127.0.0.1:5432/horse_power_cat008_test
          CATALOG_IMPORT_TARGET: local
          CATALOG_IMPORT_CONFIRM: CAT-008-ISOLATED-LOCAL
      - name: Load only the new definitive database
        if: inputs.operation == 'load-definitive'
        run: node scripts/catalog-import-definitive.mjs "$RUNNER_TEMP/catalog-copy.sqlite"
        env:
          HP_CATALOG_TARGET_PASSWORD: ${{ secrets.HP_CATALOG_TARGET_PASSWORD }}
          CATALOG_IMPORT_TARGET: horse-power-definitive
          CATALOG_IMPORT_CONFIRM: HP-DEFINITIVE-CATALOG-IMPORT
          CATALOG_RIGHTS_CONFIRMED: "true"
      - name: Delete temporary catalog file
        if: always()
        run: rm -f "$RUNNER_TEMP/catalog-copy.sqlite"
