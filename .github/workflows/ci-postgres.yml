name: CI PostgreSQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-temporary-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create isolated fictional PostgreSQL environment
        run: node scripts/ci-postgres-setup.mjs
        env:
          CI_PG_ADMIN_URL: postgres://postgres:ci-temporary-only@127.0.0.1:5432/postgres
      - name: Apply local PostgreSQL migrations
        run: npm run db:local:migrate
      - name: Seed fictitious local workshops
        run: npm run db:local:seed
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test
      - name: Stripe PostgreSQL integration
        run: npx tsx --test tests/stripeBilling.postgres.integration.ts
      - name: Install isolated Playwright browser
        run: npx playwright install --with-deps chromium
      - name: ADM-002.1 administrative UI regression
        run: node scripts/test-admin-interface.mjs
        timeout-minutes: 4
      - name: Stripe billing UI regression
        run: node scripts/test-stripe-interface.mjs
        timeout-minutes: 4
      - name: Store Stripe interface evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stripe-billing-interface
          path: ${{ runner.temp }}/stripe-ui
          retention-days: 14
      - name: Store administrative interface evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adm-002-1-interface
          path: ${{ runner.temp }}/adm0021-ui
          retention-days: 14
      - name: Capture visual screens in isolated environment
        run: npm run visual:capture -- --start --no-write --output-dir "${{ runner.temp }}/map-001-captures"
        env:
          VISUAL_BASE_URL: http://127.0.0.1:5173
          VISUAL_TEST_TENANT: local-a
      - name: Validate the visual library and indexes
        run: npm run visual:check
      - name: Store current real UI captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sistema-oficinas-map-001-captures
          path: ${{ runner.temp }}/map-001-captures
          if-no-files-found: warn
          retention-days: 14
      - name: Verify four-porte catalog, rollback and import RLS on disposable PostgreSQL 17
        run: node scripts/ci-catalog-import-setup.mjs
        env:
          CI_PG_ADMIN_URL: postgres://postgres:ci-temporary-only@127.0.0.1:5432/postgres
      - name: Verify Horse Power extension
        run: node --test tests/extension-panel.test.mjs tests/chrome-web-store.test.mjs
      - name: PostgreSQL integration suite
        run: npm run test:postgres

